---

- block:
  #- shell: sh /root/init/common/misc_config.sh cfg_nsswitch_mdns
  #  ignore_errors: true

  - stat: path='/etc/nsswitch.conf'
    ignore_errors: true
    register: nsswitchconf_st

  - block:
    #- replace:
    #    path: /etc/nsswitch.conf
    #    regexp: 'files dns'
    #    replace: 'files mdns_minimal [NOTFOUND=return] dns'
    #  ignore_errors: true

    - replace:
        path: /etc/nsswitch.conf
        regexp: '^hosts:(.*)$'
        replace: '#(old {{ymd}}) hosts:\1'
      ignore_errors: true

    - lineinfile:
        path: /etc/nsswitch.conf
        state: present
        backrefs: true
        regexp: '^(#\(old {{ymd}}\) hosts:.*)$'
        line: '\1\nhosts:\t\tfiles mdns_minimal [NOTFOUND=return] dns'
      ignore_errors: true
    when: nsswitchconf_st.stat.exists
    vars:
      ymd: '{{"%Y%m%d" | strftime(nsswitchconf_st.stat.mtime|int)}}'

- block:
  #- shell: sh /root/init/common/misc_config.sh cfg_sudo_nopasswd {{sudoersd_dir}}
  #  ignore_errors: true

  - file:
      path: '{{sudoersd_dir}}'
      state: directory

  - lineinfile:
      path: "{{sudoersd_dir + '/99_sudonopasswd'}}"
      state: present
      create: true
      regexp: '{{item.rexp}}'
      line: '{{item.line}}'
    ignore_errors: true
    loop: [{rexp: '^[^#].*requiretty', line: '#Defaults:%sudo !requiretty'},
      {rexp: '^.*%sudo.*ALL.*NOPASSWD.*', line: '%sudo ALL=(ALL:ALL) NOPASSWD: ALL'}
      ]
    when: variant in ['debian']

  - lineinfile:
      path: "{{sudoersd_dir + '/99_wheelnopasswd'}}"
      state: present
      create: true
      regexp: '{{item.rexp}}'
      line: '{{item.line}}'
    ignore_errors: true
    loop: [{rexp: '^[^#].*requiretty', line: '#Defaults:%wheel !requiretty'},
      {rexp: '^.*%wheel.*ALL.*NOPASSWD.*', line: '%wheel ALL=(ALL:ALL) NOPASSWD: ALL'}
      ]
    when: variant not in ['debian']

- block:
  #- shell: sh /root/init/common/misc_config.sh cfg_inputrc_histsearch
  #  ignore_errors: true

  #- shell: command -v bind
  #  register: bind_cmd
  #  ignore_errors: true

  - blockinfile:
      path: /etc/skel/.inputrc
      state: present
      marker: '#-- {mark} managed zone --'
      marker_begin: 'start'
      marker_end: 'end'
      create: true
      block: |
        "\e[A": history-search-backward
        "\e[B": history-search-forward
    ignore_errors: true
    #when: not bind_cmd.get('failed', false)
  when: ansible_facts.get('system')|lower == 'linux'

