- include_tasks: '{{cfgfile}}'
  with_first_found:
    - files:
      - 'userifc/config_{{variant}}.yml'
      skip: True
  loop_control: {"loop_var": "cfgfile"}

- block:
  #- shell: sh /root/init/common/misc_config.sh cfg_xdguserdirs {{etcdir_xdg}}
  #  ignore_errors: true

  - name: Add directory bin to XDG directories config
    lineinfile:
      path: '{{etcdir_xdg}}/user-dirs.defaults'
      state: present
      create: true
      regexp: '^BIN=.*'
      line: 'BIN=bin'
    ignore_errors: true

  - name: Run xdg-user-dirs-update
    shell: |
      export LANG=en_US.UTF-8 ; export CHARSET=UTF-8
      xdg-user-dirs-update ; chmod 1777 /tmp
    ignore_errors: true

#- shell: sh /root/init/common/misc_config.sh cfg_xorgtouchpad {{xorgconfd_dir}}
#  ignore_errors: true

- lineinfile:
    path: '{{xorgconfd_dir}}/{{confX}}'
    state: present
    insertafter: 'MatchIsTouchpad.*'
    regexp: '.*Option "Tapping" "on".*'
    line: '       Option "Tapping" "on"'
  ignore_errors: true
  loop: [10-evdev.conf, 40-libinput.conf]
  loop_control: {"loop_var": "confX"}


- block:
  - name: "Set graphical.target default for systemd"
    shell: systemctl set-default graphical.target
    ignore_errors: true
    when: service_mgr == 'systemd'

  - name: "Enable user interface related service(s) ({{desktop}}) ({{service_mgr}})"
    systemd_service: name={{item}} enabled=true masked=false
    ignore_errors: true
    loop: '{{distro_pkgs.get("uiservices_enabled_"+desktop, "").split(" ")}}'
    when: service_mgr == 'systemd'

  - name: "Disable user interface related service(s) ({{desktop}}) ({{service_mgr}})"
    systemd_service: name={{item}} enabled=false masked=true
    ignore_errors: true
    loop: '{{distro_pkgs.get("uiservices_disabled_"+desktop, "").split(" ")}}'
    when: service_mgr == 'systemd'

  - name: "Enable user interface related service(s) ({{desktop}}) ({{service_mgr}})"
    service: name={{item}} enabled=true
    ignore_errors: true
    loop: '{{distro_pkgs.get("uiservices_enabled_"+desktop, "").split(" ")}}'
    when: service_mgr != 'systemd'

  - name: "Disable user interface related service(s) ({{desktop}}) ({{service_mgr}})"
    service: name={{item}} enabled=false
    ignore_errors: true
    loop: '{{distro_pkgs.get("uiservices_disabled_"+desktop, "").split(" ")}}'
    when: service_mgr != 'systemd'

- block:
  - name: "Clean pkg cache (pkg_mgr: {{pkg_mgr}})"
    package: use='{{pkg_mgr}}' clean=true
    register: out
    when: pkg_mgr in ['apt', 'pkgin', 'apt_rpm']

  - name: "Clean pkg cache (pkg_mgr: {{pkg_mgr}})"
    shell: '{{pkgclean_cmd}}'
    ignore_errors: true
    register: out
    when: pkg_mgr not in ['apt', 'pkgin', 'apt_rpm']
  - debug: var=out.stdout_lines
