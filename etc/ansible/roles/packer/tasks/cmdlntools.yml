- block:
  - name: "Setup skeleton paths"
    file:
      path: '{{item}}'
      state: directory
    loop: '{{skel_dirs}}'

  - shell: "cp -a /root/init/common/skel/{{item.srcskel}} {{skeldir_par}}/{{item.destskel}}"
    ignore_errors: true
    loop: '{{skelmaps_srcdest}}'


- include_tasks: '{{cfgfile}}'
  with_first_found:
    - files:
      - 'cmdlntools/config_{{variant}}.yml'
      skip: True
  loop_control: {"loop_var": "cfgfile"}

- include_tasks: '{{cfgfile}}'
  loop: [common/config_cron.yml, common/config_smtp.yml
        , common/config_firewall.yml, common/misc_config.yml]
  loop_control: {"loop_var": "cfgfile"}

- shell: |
    lpstat -t
  ignore_errors: true

- block:
  - name: "Enable service(s) ({{service_mgr}})"
    systemd_service: name={{item}} enabled=true masked=false
    ignore_errors: true
    loop: '{{distro_pkgs.services_enabled.split(" ")}}'
    when: service_mgr == 'systemd'

  - name: "Disable service(s) ({{service_mgr}})"
    systemd_service: name={{item}} enabled=false masked=true
    ignore_errors: true
    loop: '{{distro_pkgs.services_disabled.split(" ")}}'
    when: service_mgr == 'systemd'

  - name: "Enable service(s) ({{service_mgr}})"
    service: name={{item}} enabled=true
    ignore_errors: true
    loop: '{{(distro_pkgs.services_enabled|replace("rsyslog ", "")).split(" ")}}'
    when: service_mgr == 'openrc'

  - name: "Enable service rsyslog runlevel boot ({{service_mgr}})"
    service: name=rsyslog enabled=true runlevel=boot
    ignore_errors: true
    when: service_mgr == 'openrc'

  - name: "Disable service(s) ({{service_mgr}})"
    service: name={{item}} enabled=false
    ignore_errors: true
    loop: '{{(distro_pkgs.services_disabled|replace("syslog ", "")).split(" ")}}'
    when: service_mgr == 'openrc'

  - name: "Disable service syslog runlevel boot ({{service_mgr}})"
    service: name=syslog enabled=false runlevel=boot
    ignore_errors: true
    when: service_mgr == 'openrc'

  - name: "Enable service(s) ({{service_mgr}})"
    service: name={{item}} enabled=true
    ignore_errors: true
    loop: '{{distro_pkgs.services_enabled.split(" ")}}'
    when: service_mgr not in ['systemd', 'openrc']

  - name: "Disable service(s) ({{service_mgr}})"
    service: name={{item}} enabled=false
    ignore_errors: true
    loop: '{{distro_pkgs.services_disabled.split(" ")}}'
    when: service_mgr not in ['systemd', 'openrc']

- block:
  - name: "Send email sample using sendmail"
    shell: |
      cat << EOF | sendmail -t root
      To: packer
      Subject: Subject sample

      Email sample
      EOF
    ignore_errors: true
    register: out

  - name: "Send sample email using mail"
    shell: |
      echo Sample email | mail -u vagrant -s "Sample subject" root packer
    ignore_errors: true
    register: out
    when: ansible_facts.get('system')|lower in ['freebsd']

  - block:
    #- name: "Send sample email using mail"
    #  shell: |
    #    echo Sample email | mail -r vagrant@{{ansible_facts.get("nodename")}} \
    #      -s "Sample subject" root packer
    #  ignore_errors: true
    #  register: out
    #  when: variant in ['alpine', 'debian']

    - find:
        paths: /bin,/usr/bin,/usr/local/bin,/usr/pkg/bin
        recurse: true
        patterns: 'nail,s-nail,mailx'
      ignore_errors: true
      register: found_mailcmds

    - shell: |
        #find /bin /usr/bin /usr/local/bin /usr/pkg/bin -name "nail" \
        #  -o -name "s-nail" -o -name "mailx" | head -n1
        which nail s-nail mailx | head -n1
      ignore_errors: true
      register: out_mailcmd

    - name: "Send sample email using {{mail_cmd}}"
      shell: |
        echo Sample email | {{mail_cmd}} -r vagrant@{{ansible_facts.get("nodename")}} \
          -s "Sample subject" root packer
      ignore_errors: true
      register: out
      #when: variant not in ['alpine', 'debian'] and 0 != found_mailcmds.matched
      vars:
        #mail_cmd: '{{(found_mailcmds.files[0].path | default("mail"))|basename}}'
        mail_cmd: '{{(out_mailcmd.stdout_lines[0] | default("mail"))|basename}}'
    when: ansible_facts.get('system')|lower not in ['freebsd']

- block:
  - name: "Clean pkg cache (pkg_mgr: {{pkg_mgr}})"
    package: use='{{pkg_mgr}}' clean=true
    register: out
    when: pkg_mgr in ['apt', 'pkgin', 'apt_rpm']

  - name: "Clean pkg cache (pkg_mgr: {{pkg_mgr}})"
    shell: '{{pkgclean_cmd}}'
    ignore_errors: true
    register: out
    when: pkg_mgr not in ['apt', 'pkgin', 'apt_rpm']
  - debug: var=out.stdout_lines

