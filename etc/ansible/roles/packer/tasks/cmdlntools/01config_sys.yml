---

- block:
  - shell: /usr/pkg/bin/dbus-uuidgen --ensure
    ignore_errors: true
    when: ansible_facts.get('system')|lower == 'netbsd'

  - shell: /usr/local/bin/dbus-uuidgen --ensure
    ignore_errors: true
    when: ansible_facts.get('system')|lower == 'openbsd'
  when: ansible_facts.get('system')|lower in ['netbsd', 'openbsd']

- shell: '{{idsuffix_cmd}}'
  ignore_errors: true
  register: idsuffix_result

- block:
  - name: "Fix hostname regexp box.0000"
    replace:
      path: "{{item}}"
      regexp: '{{hostname_0000_if}}0000'
      replace: '{{hostname_0000_if}}{{idsuffix_result.stdout}}'
    ignore_errors: true
    loop: '{{hostname_chgfiles}}'

  - hostname: name={{hostname_0000_if}}{{idsuffix_result.stdout}}
    ignore_errors: true
  when: ansible_facts.get("nodename") is match(".*box.0000")
  vars:
    hostname_0000_if: '{{ansible_facts.get("nodename")|regex_search("(.*box.)")}}'

- file: path=/etc/profile.d state=directory
  ignore_errors: true

- stat: path='/etc/profile'
  ignore_errors: true
  register: etcprofile_st

- shell: |
    if [ ! -e /etc/profile ] ; then
      cat << EOF > /etc/profile ;
    if [ -d /etc/profile.d ] ; then
      for i in /etc/profile.d/*.sh ; do
        if [ -r "${i}" ] ; then
          . "${i}" ;
        fi ;
      done ;
      unset i ;
    fi

    EOF
      chmod +x /etc/profile ;
    fi

  ignore_errors: true
  when: not etcprofile_st.stat.exists

- shell: java -version
  register: out_java
  ignore_errors: true

#- find:
#    #paths: /bin, /usr/bin, /usr/local/bin, /usr/pkg/bin
#    paths: /
