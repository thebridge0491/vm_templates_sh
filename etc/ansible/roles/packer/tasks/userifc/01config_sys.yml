---

- file: path=/etc/profile.d state=directory
  ignore_errors: true

- stat: path='/etc/profile'
  ignore_errors: true
  register: etcprofile_st

- shell: |
    if [ ! -e /etc/profile ] ; then
      cat << EOF > /etc/profile ;
    if [ -d /etc/profile.d ] ; then
      for i in /etc/profile.d/*.sh ; do
        if [ -r "${i}" ] ; then
          . "${i}" ;
        fi ;
      done ;
      unset i ;
    fi

    EOF
      chmod +x /etc/profile ;
    fi

  ignore_errors: true
  when: not etcprofile_st.stat.exists

- shell: java -version
  register: out_java
  ignore_errors: true

#- find:
#    #paths: /bin, /usr/bin, /usr/local/bin, /usr/pkg/bin
#    paths: /
