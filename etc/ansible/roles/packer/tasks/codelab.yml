---

- block:
  - block:
    - service: name=pamac state=stopped
      ignore_errors: true

    - file: path=/var/lib/pacman/db.lck state=absent
      ignore_errors: true
    when: pkg_mgr == 'pacman'

  - block:
    - shell: |
        apt-config dump | grep -we Recommends -e Suggests | sed 's|1|0|' | \
          tee /etc/apt/apt.conf.d/999norecommends
      ignore_errors: true

    - lineinfile:
        path: /etc/apt/apt.conf.d/99force-ipv4
        state: present
        create: true
        regexp: 'Acquire::ForceIPv4.*;'
        line: '#Acquire::ForceIPv4 "true";'
      ignore_errors: true

    - lineinfile:
        path: /etc/apt/apt.conf.d/99retries03
        state: present
        create: true
        regexp: '^Acquire::Retries.*;'
        line: 'Acquire::Retries "3";'
      ignore_errors: true
    when: pkg_mgr in ['apt', 'apt_rpm']

  - block:
    - lineinfile:
        path: /etc/zypp/zypp.conf
        state: present
        create: true
        regexp: '.*solver.onlyRequires.*=.*'
        line: 'solver.onlyRequires = true'
      ignore_errors: true

    - lineinfile:
        path: /etc/zypp/zypp.conf
        state: present
        create: true
        regexp: '.*installRecommends.*=.*'
        line: 'installRecommends = no'
      ignore_errors: true

    - package: use='{{pkg_mgr}}' name=netcat-openbsd state=absent
      ignore_errors: true
    when: pkg_mgr == 'zypper'

  - shell: |
      dnf --setopt=install_weak_deps=False config-manager --save
      dnf config-manager --dump | grep -we install_weak_deps
    ignore_errors: true
    when: pkg_mgr == 'dnf'

  - block:
    - name: "Refresh pkg db (pkg_mgr: {{pkg_mgr}})"
      package: use='{{pkg_mgr}}' name=pkg
      register: out
      when: pkg_mgr == 'pkgng'

    - name: "Refresh pkg db (pkg_mgr: {{pkg_mgr}})"
      package: use='{{pkg_mgr}}' update_cache=true
      register: out
      when: pkg_mgr not in ['pkgng', 'openbsd_pkg']
    - debug: var=out

    - name: "Display coding lab packages (lang: {{langX}})"
      #shell: |
      #  . /root/scripts/distro_pkgs.ini
      #  for langX in ${LANGS} ; do
      #    echo ${pkgs_lang_${langX}} ;
      #  done
      #ignore_errors: true
      debug: msg={{distro_pkgs.get("pkgs_lang_"+langX, "").split(" ")}}
      loop: '{{langs.split(" ")}}'
      loop_control: {"loop_var": "langX"}

- block:
  - block:
    - name: "Enter 'yes' to continue [noYES]:"
      pause:
        prompt: "Enter 'yes' to continue, else stop playbook [noYES]: "
      register: response

    - name: "Check autoconfirm or response is 'yes'"
      #fail: msg="Stopping playbook"
      meta: end_host
      when: not (('' == response.get('user_input', '') or response.user_input | default(true))|bool)
    when: not (autoconfirm | default(true))|bool

  - package: use='{{pkg_mgr}}' name='{{distro_pkgs.get("pkgs_lang_"+langX, "").replace(" ", ",")}}' state=present extra_args_precommand='--ignore-unknown'
    ignore_errors: true
    loop: '{{langs.split(" ")}}'
    loop_control: {"loop_var": "langX"}
    when: pkg_mgr == 'zypper'

  - package: use='{{pkg_mgr}}' name='{{distro_pkgs.get("pkgs_lang_"+langX, "").replace(" ", ",")}}' state=present skip_broken=true
    ignore_errors: true
    loop: '{{langs.split(" ")}}'
    loop_control: {"loop_var": "langX"}
    when: pkg_mgr == 'dnf'

  - block:
    - package: use='{{pkg_mgr}}' name='{{distro_pkgs.get("pkgs_lang_"+langX, "").replace(" ", ",")}}' state=present
      ignore_errors: true
      register: out
      loop: '{{langs.split(" ")}}'
      loop_control: {"loop_var": "langX"}

    - name: retry failed install
      package:
        use: '{{pkg_mgr}}'
        name: '{{item}}'
        state: present
        ignore_errors: true
        loop: '{{distro_pkgs.get("pkgs_lang_"+langX, "").split(" ")}}'
      ignore_errors: true
      loop: '{{langs.split(" ")}}'
      loop_control: {"loop_var": "langX"}
      when: out.get('failed', false)
    when: pkg_mgr not in ['zypper', 'dnf']
    #vars:
    #  pkgs_langX_commasep: '{{distro_pkgs.get("pkgs_lang_"+langX, "").replace(" ", ",")}}'
    #  pkgs_langX_list: '{{distro_pkgs.get("pkgs_lang_"+langX, "").split(" ")}}'
    #loop: '{{langs.split(" ")}}'
    #loop_control: {"loop_var": "langX"}


- shell: java -version
  register: out_java
  ignore_errors: true

#- find:
#    #paths: /bin, /usr/bin, /usr/local/bin, /usr/pkg/bin
#    paths: /
#    recurse: true
#    patterns: 'java'
#  register: found_result

- block:
  - shell: |
      #dirname $(dirname $(realpath $(which java)))
      realpath $(which java) | sed "s:/bin/java::"
    register: out_javahome

  #- lineinfile:
  #    path: /etc/csh.cshrc
  #    state: present
  #    regexp: '^setenv JAVA_HOME.*'
  #    line: 'setenv JAVA_HOME {{out_javahome}}'
  #  ignore_errors: true
  #  when: ansible_facts.get("env")["SHELL"] is search("csh")

  #- lineinfile:
  #    path: /etc/bash.bashrc
  #    state: present
  #    regexp: '^export JAVA_HOME.*'
  #    line: 'export JAVA_HOME={{out_javahome}}'
  #  ignore_errors: true
  #  when: ansible_facts.get("env")["SHELL"] is search("bash")

  #- lineinfile:
  #    path: /etc/ksh.kshrc
  #    state: present
  #    regexp: '^export JAVA_HOME.*'
  #    line: 'export JAVA_HOME={{out_javahome}}'
  #  ignore_errors: true
  #  when: ansible_facts.get("env")["SHELL"] is search("ksh")

  - lineinfile:
      path: /etc/profile.d/jdk.sh
      state: present
      create: true
      regexp: '^export JAVA_HOME.*'
      line: 'export JAVA_HOME={{out_javahome}}'
    ignore_errors: true

  - lineinfile:
      path: /etc/fstab
      state: present
      regexp: '^fdesc'
      line: 'fdesc  /dev/fd  fdescfs  rw  0  0'
    ignore_errors: true
    when: ansible_facts.get('system')|lower != 'linux'

  # PATH_TO_FX location varies: # try find javafx[-.]fxml*.jar
  #  [/usr/lib/jvm/java-[N]-openjfx|/opt/javafx-sdk-[N]]/lib: Arch Linux, Gluon download
  #  /usr/local/openjfx[N]/lib: FreeBSD
  #  /usr/share/openjfx: Debian
  - find:
      paths: /usr, /opt
      patterns: 'javafx[-.]fxml.*.jar'
      recurse: true
    register: found_jfxjar

  - shell: find /usr /opt -name "javafx[-.]fxml*.jar" | head -n1
    ignore_errors: true
    register: out_jfxjar

  - lineinfile:
      path: /etc/profile.d/jdk.sh
      state: present
      create: true
      regexp: '^export PATH_TO_FX.*'
      #line: 'export PATH_TO_FX={{((found_jfxjar.files | json_query("[*].path"))[0] | default("/usr/lib/jvm/java-11-openjfx/lib/javafx.fxml.jar"))|dirname)}}'
      line: 'export PATH_TO_FX={{(out_jfxjar.stdout_lines[0] | default("/usr/lib/jvm/java-11-openjfx/lib/javafx.fxml.jar"))|dirname}}'
    ignore_errors: true
  when: not out_java.get('failed', false)
  #when: 0 != found_result.matched


- include_tasks: '{{cfgfile}}'
  with_first_found:
    - files:
      - 'codelab/config_{{variant}}.yml'
      skip: True
  loop_control: {"loop_var": "cfgfile"}


- block:
  - name: "Enable coding lab related service(s) ({{service_mgr}})"
    systemd_service: name={{item}} enabled=true masked=false
    ignore_errors: true
    loop: '{{distro_pkgs.labservices_enabled.split(" ")}}'
    when: service_mgr == 'systemd'

  - name: "Disable coding lab related service(s) ({{service_mgr}})"
    systemd_service: name={{item}} enabled=false masked=true
    ignore_errors: true
    loop: '{{distro_pkgs.labservices_disabled.split(" ")}}'
    when: service_mgr == 'systemd'

  - name: "Enable coding lab related service(s) ({{service_mgr}})"
    service: name={{item}} enabled=true
    ignore_errors: true
    loop: '{{distro_pkgs.labservices_enabled.split(" ")}}'
    when: service_mgr != 'systemd'

  - name: "Disable coding lab related service(s) ({{service_mgr}})"
    service: name={{item}} enabled=false
    ignore_errors: true
    loop: '{{distro_pkgs.labservices_disabled.split(" ")}}'
    when: service_mgr != 'systemd'

- block:
  - name: "Clean pkg cache (pkg_mgr: {{pkg_mgr}})"
    package: use='{{pkg_mgr}}' clean=true
    register: out
    when: pkg_mgr in ['apt', 'pkgin', 'apt_rpm']

  - name: "Clean pkg cache (pkg_mgr: {{pkg_mgr}})"
    shell: '{{pkgclean_cmd}}'
    ignore_errors: true
    register: out
    when: pkg_mgr not in ['apt', 'pkgin', 'apt_rpm']
  - debug: var=out.stdout_lines
