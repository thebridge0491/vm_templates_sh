---

#- block:
#  - set_fact: cacheable=false distrosets=["xbase", "xserver", "xfont", "xetc"]
#  - include_tasks: common/fetch_distrosets.yml

- block:
  - name: "set video resolution ? gop 6: 1024x768x32"
    replace:
      path: /boot.cfg
      regexp: ';boot'
      replace: ';gop 6;boot'
    ignore_errors: true

  - group: name=dbus gid=81 system=true state=present
    ignore_errors: true

  - user: name=dbus uid=81 groups=dbus comment='System message bus' home=/ shell=/usr/bin/false
    ignore_errors: true

  - file: path={{item}} state=directory
    ignore_errors: true
    loop: [/var/run/dbus, /var/db/dbus, /var/run/xdm, /var/lib/xdm
          , /usr/pkg/etc/xdm, /usr/pkg/etc/xdg]

  - shell: "cp -a /usr/pkg/share/examples/rc.d/{{item}} /etc/rc.d/{{item}}"
    ignore_errors: true
    loop: [dbus, xdm]

  - copy:
      src: /usr/pkg/share/examples/xdm
      dest: /usr/pkg/etc/
      mode: 'ugo+x'
    ignore_errors: true

  - copy:
      src: '/usr/pkg/share/examples/{{item}}'
      dest: /usr/pkg/etc/xdg/
      mode: 'ugo+x'
    ignore_errors: true
    loop: [xfce4, lxqt, kde]

- file: path=/usr/pkg/etc/X11/xorg.conf.d state=directory
  ignore_errors: true

- stat: path=/usr/pkg/share/X11/xorg.conf.d
  ignore_errors: true
  register: xorgconfd_dir_st

- block:
  - shell: "cp -an /usr/pkg/share/X11/xorg.conf.d/{{confX}} /usr/pkg/etc/X11/xorg.conf.d/"
    ignore_errors: true
    loop: [10-evdev.conf, 40-libinput.conf]
    loop_control: {"loop_var": "confX"}

  #- shell: sh /root/init/common/misc_config.sh cfg_xorgtouchpad /usr/pkg/etc/X11/xorg.conf.d
  #  ignore_errors: true

  - lineinfile:
      path: '/usr/pkg/etc/X11/xorg.conf.d/{{confX}}'
      state: present
      insertafter: '^[^#]\s*MatchIsTouchpad.*'
      regexp: '.*Option "Tapping" "on".*'
      line: '       Option "Tapping" "on"'
    ignore_errors: true
    loop: [10-evdev.conf, 40-libinput.conf]
    loop_control: {"loop_var": "confX"}
  when: xorgconfd_dir_st.stat.exists and xorgconfd_dir_st.stat.isdir

- block:
  # /usr/pkg/etc/X11/xorg.conf.d/20-[wsfb|intel|radeon].conf
  - copy:
      dest: /usr/pkg/etc/X11/xorg.conf.d/20-wsfb.conf
      #mode: 'ugo+x'
      force: false
      content: |
        Section "Device"
          Identifier "Card0"
          Driver "wsfb" # wsfb | intel | radeon
          #BusID "PCI:0:2:0"
        EndSection

    ignore_errors: true

  - copy:
      dest: /usr/pkg/etc/X11/xorg.conf.d/10-modesetting.conf
      #mode: 'ugo+x'
      force: false
      content: |
        #Section "Device"
        #  Identifier "Card0"
        #  Driver "modesetting"
        #  #BusID "PCI:0:2:0"
        #EndSection

    ignore_errors: true

- block:
  - lineinfile:
      path: /root/.xinitrc
      state: present
      regexp: '{{item.rexp}}'
      line: '{{item.line}}'
      create: yes
    ignore_errors: true
    loop: [{rexp: '^export XDG_DATA_DIRS=.*', line: 'export XDG_DATA_DIRS=/usr/pkg/share'},
      {rexp: '^export XDG_CONFIG_DIRS=.*', line: 'export XDG_CONFIG_DIRS=/usr/pkg/etc/xdg'}]

  - lineinfile:
      path: /root/.xinitrc
      state: present
      create: yes
      regexp: '^ck-launch-session.*'
      line: 'ck-launch-session dbus-launch --exit-with-session startxfce4'
    ignore_errors: true
    when: desktop in ['xfce']

  - lineinfile:
      path: /root/.xinitrc
      state: present
      create: yes
      regexp: '^ck-launch-session.*'
      line: 'ck-launch-session dbus-launch --exit-with-session startkde'
    ignore_errors: true
    when: desktop in ['kde']

  - lineinfile:
      path: /root/.xinitrc
      state: present
      create: yes
      regexp: '^ck-launch-session.*'
      line: 'ck-launch-session dbus-launch --exit-with-session startlxqt'
    ignore_errors: true
    when: desktop in ['lxqt']

  - copy: src=/root/.xinitrc dest=/home/packer/ owner=packer
    ignore_errors: true

  - file: src={{item}}/.xinitrc dest={{item}}/.xsession state=link
    ignore_errors: true
    loop: [/root, /home/packer]

