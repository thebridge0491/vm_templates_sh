---

- block:
  - block:
    - service: name=pamac state=stopped
      ignore_errors: true

    - file: path=/var/lib/pacman/db.lck state=absent
      ignore_errors: true
    when: pkg_mgr == 'pacman'

  - block:
    - shell: |
        apt-config dump | grep -we Recommends -e Suggests | sed 's|1|0|' | \
          tee /etc/apt/apt.conf.d/999norecommends
      ignore_errors: true

    - lineinfile:
        path: /etc/apt/apt.conf.d/99force-ipv4
        state: present
        create: true
        regexp: 'Acquire::ForceIPv4.*;'
        line: '#Acquire::ForceIPv4 "true";'
      ignore_errors: true

    - lineinfile:
        path: /etc/apt/apt.conf.d/99retries03
        state: present
        create: true
        regexp: '^Acquire::Retries.*;'
        line: 'Acquire::Retries "3";'
      ignore_errors: true
    when: pkg_mgr in ['apt', 'apt_rpm']

  - block:
    - lineinfile:
        path: /etc/zypp/zypp.conf
        state: present
        create: true
        regexp: '.*solver.onlyRequires.*=.*'
        line: 'solver.onlyRequires = true'
      ignore_errors: true

    - lineinfile:
        path: /etc/zypp/zypp.conf
        state: present
        create: true
        regexp: '.*installRecommends.*=.*'
        line: 'installRecommends = no'
      ignore_errors: true

    - package: use='{{pkg_mgr}}' name=netcat-openbsd state=absent
      ignore_errors: true
    when: pkg_mgr == 'zypper'

  - shell: |
      dnf --setopt=install_weak_deps=False config-manager --save
      dnf config-manager --dump | grep -we install_weak_deps
    ignore_errors: true
    when: pkg_mgr == 'dnf'

  - block:
    - name: "Refresh pkg db (pkg_mgr: {{pkg_mgr}})"
      package: use='{{pkg_mgr}}' name=pkg
      register: out
      when: pkg_mgr == 'pkgng'

    - name: "Refresh pkg db (pkg_mgr: {{pkg_mgr}})"
      package: use='{{pkg_mgr}}' update_cache=true
      register: out
      when: pkg_mgr not in ['pkgng', 'openbsd_pkg']
    - debug: var=out

    - name: "Display cmdline-tools packages"
      #shell: . /root/scripts/distro_pkgs.ini ; echo ${pkgs_cmdln_tools}
      #ignore_errors: true
      debug: var=distro_pkgs.pkgs_cmdln_tools

- block:
  - block:
    - name: "Enter 'yes' to continue [noYES]:"
      pause:
        prompt: "Enter 'yes' to continue, else stop playbook [noYES]: "
      register: response

    - name: "Check autoconfirm or response is 'yes'"
      #fail: msg="Stopping playbook"
      meta: end_host
      when: not (('' == response.get('user_input', '') or response.user_input | default(true))|bool)
    when: not (autoconfirm | default(true))|bool

  - package: use='{{pkg_mgr}}' name='{{pkgs_cmdlntools_commasep}}' state=present extra_args_precommand='--ignore-unknown'
    ignore_errors: true
    when: pkg_mgr == 'zypper'

  - package: use='{{pkg_mgr}}' name='{{pkgs_cmdlntools_commasep}}' state=present skip_broken=true
    ignore_errors: true
    when: pkg_mgr == 'dnf'

  - block:
    - package: use='{{pkg_mgr}}' name='{{pkgs_cmdlntools_commasep}}' state=present
      ignore_errors: true
      register: out

    - name: retry failed install
      package: use='{{pkg_mgr}}' name='{{item}}' state=present
      ignore_errors: true
      loop: '{{pkgs_cmdlntools_list}}'
      when: out.get('failed', false)
    when: pkg_mgr not in ['zypper', 'dnf']
  vars:
    pkgs_cmdlntools_commasep: '{{distro_pkgs.pkgs_cmdln_tools.replace(" ", ",")}}'
    pkgs_cmdlntools_list: '{{distro_pkgs.pkgs_cmdln_tools.split(" ")}}'


- shell: '{{idsuffix_cmd}}'
  ignore_errors: true
  register: idsuffix_result

- block:
  - name: "Fix hostname regexp box.0000"
    replace:
      path: "{{item}}"
      regexp: '{{hostname_0000_if}}0000'
      replace: '{{hostname_0000_if}}{{idsuffix_result.stdout}}'
    ignore_errors: true
    loop: '{{hostname_chgfiles}}'

  - hostname: name={{hostname_0000_if}}{{idsuffix_result.stdout}}
    ignore_errors: true
  when: ansible_facts.get("nodename") is match(".*box.0000")
  vars:
    hostname_0000_if: '{{ansible_facts.get("nodename")|regex_search("(.*box.)")}}'

